[project]
name = "nonebot-plugin-ccb"
version = "0.1.0"
description = "和群友发生赛博ccb行为的 NoneBot2 群娱乐插件"
readme = "README.md"
requires-python = ">=3.10, <4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zebwqfox" }]
keywords = ["nonebot", "nonebot2", "onebot", "qq", "ccb"]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-localstore>=0.7.0",
    "pydantic>=1.10",
]

[project.urls]
Homepage = "https://github.com/zebwqfox/nonebot-plugin-ccb"
Issues = "https://github.com/zebwqfox/nonebot-plugin-ccb/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_ccb"]

[tool.nonebot]
plugins = ["nonebot_plugin_ccb"]
